{% extends "layout.html" %}
{% block title%}
    notifications
{% endblock%}

{% block main%}
<center>
    <h2>
        notifications
    </h2>
</center>

<div class = "notification-container">

    {% for notification in notifications %}
        <div class = "notification">
            <h3>
                {{notification["data"]}}
            </h3>
        </div>
    {% endfor %}
</div>

{% endblock %}
